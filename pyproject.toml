[project]
name = "mechanism"
version = "0.1.0"
description = "Small language model mechanistic interpretability experiments"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.10",
    "einops>=0.8",
    "huggingface-hub>=1.5,<2",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "safetensors>=0.6",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "seaborn>=0.13",
    "sentencepiece>=0.2",
    "torch>=2.12,<3",
    "tqdm>=4.67",
    "transformers>=5.6.2,<6",
]

[dependency-groups]
dev = ["ipykernel>=6.30"]

[tool.uv.sources]
torch = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
