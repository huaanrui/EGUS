[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "egus"
version = "0.1.0"
description = "Evidence-Gated Unknown Selection and controlled BBQ steering comparisons"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2",
  "joblib>=1.4", "threadpoolctl>=3.5"
]

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "transformers==5.18.0", "accelerate>=1.10", "safetensors>=0.6", "sentencepiece>=0.2", "einops>=0.8", "tqdm>=4.67"]
dev = ["ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["egus*"]

[tool.ruff]
line-length = 100
exclude = ["third_party", "archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
